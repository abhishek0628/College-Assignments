<!DOCTYPE html>
<html>
<head>
    <title>OMAS Safety Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        textarea {
            width: 100%;
            height: 250px;
        }

        .box {
            margin-bottom: 20px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        pre {
            background: #111;
            color: #0f0;
            padding: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h2>OMAS → RBN → Safety Checker</h2>

<!-- FILE INPUT -->
<div class="box">
    <h3>Upload Input File</h3>
    <input type="file" id="fileInput" accept=".txt">
</div>

<!-- TEXT INPUT -->
<div class="box">
    <h3>Or Paste Input</h3>
    <textarea id="input"></textarea>
</div>

<button onclick="checkSafety()">Check Safety</button>

<h3>Output</h3>
<pre id="output"></pre>

<script src="script.js"></script>

</body>
</html>
